<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essential Shop</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
    header { background: #222; color: #fff; padding: 15px; text-align: center; }
    .container { padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
    .product { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .product img { width: 100%; border-radius: 10px; }
    .product h3 { margin: 10px 0; }
    .price { color: green; font-weight: bold; }
    button { background: #222; color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
    button:hover { background: #555; }
    footer { text-align: center; padding: 10px; background: #222; color: #fff; margin-top: 20px; }
  </style>
</head>
<body><header>
  <h1>Essential Shop</h1>
  <p>Your daily needs in one place</p>
</header><div class="container">
  <div class="product">
    <img src="https://via.placeholder.com/200" alt="Product">
    <h3>Face Mask</h3>
    <p class="price">₱50</p>
    <button onclick="addToCart('Face Mask')">Add to Cart</button>
  </div>  <div class="product">
    <img src="https://via.placeholder.com/200" alt="Product">
    <h3>Hand Sanitizer</h3>
    <p class="price">₱120</p>
    <button onclick="addToCart('Hand Sanitizer')">Add to Cart</button>
  </div>  <div class="product">
    <img src="https://via.placeholder.com/200" alt="Product">
    <h3>Toothpaste</h3>
    <p class="price">₱80</p>
    <button onclick="addToCart('Toothpaste')">Add to Cart</button>
  </div>  <div class="product">
    <img src="https://via.placeholder.com/200" alt="Product">
    <h3>Shampoo</h3>
    <p class="price">₱150</p>
    <button onclick="addToCart('Shampoo')">Add to Cart</button>
  </div>
</div><footer>
  <p>© 2026 Essential Shop</p>
</footer><script>
  function addToCart(product) {
    alert(product + " added to cart!");
  }
</script></body>
</html>
